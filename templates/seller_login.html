<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Seller Login - BabyBloom</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=seller-login-{{ range(1,9999)|random }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">

  <header class="auth-header">
    <a href="/" class="auth-logo">
      <span class="logo-icon">🍼</span>
      <span class="logo-text">BabyBloom</span>
    </a>
  </header>

  <div class="auth-container">
    <div class="auth-card">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
              {{ message }}
              <button class="alert-close" onclick="this.parentElement.style.display='none'">&times;</button>
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="form-header">
        <h2>Seller Sign In</h2>
        <p>Sign in to manage your store and orders.</p>
      </div>

      <form method="POST" action="{{ url_for('seller_login') }}" class="auth-form">
        <div class="form-group">
          <label for="selleremail">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">📧</span>
            <input id="selleremail" name="selleremail" type="email" placeholder="Enter your seller email" required>
          </div>
        </div>

        <div class="form-group">
          <label for="sellerpassword">Password</label>
          <div class="input-wrapper password-wrapper">
            <span class="input-icon">🔒</span>
            <input id="sellerpassword" name="sellerpassword" type="password" placeholder="Enter your password" required>
          </div>
        </div>

        <div class="form-row" style="justify-content:space-between;align-items:center">
          <label class="checkbox">
            <input type="checkbox" name="remember" value="1"> Remember me
          </label>
          <a href="{{ url_for('seller_signup') }}" class="link-muted">Create seller account</a>
        </div>

        <div class="form-actions">
          <button type="submit" class="auth-btn">Sign In</button>
        </div>
      </form>

      <div class="form-footer">
        <p><a href="{{ url_for('seller_login') }}">Back to home</a></p>
      </div>
    </div>
  </div>

  <script>document.getElementById('selleremail')?.focus();</script>
</body>
</html>
