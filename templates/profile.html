<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="profile-page">
        <h1>Your Profile</h1>
        {% if user.avatar %}
            <img src="{{ user.avatar }}" alt="Profile" style="width:120px;height:120px;border-radius:50%;object-fit:cover;">
        {% else %}
            <div style="width:120px;height:120px;border-radius:50%;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:48px;">
                {{ (user.username[:1] if user.username) |upper }}
            </div>
        {% endif %}
        <h2>{{ user.username }}</h2>
        <p>{{ user.email }}</p>
        <a href="/">Back to shop</a>
    </div>
</body>
</html>
