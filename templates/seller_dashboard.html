<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard - BabyBloom</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}?v=seller-dash-{{ range(1,9999)|random }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="admin-body">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <div class="logo-icon">
                    <i class="fas fa-shopping-cart"></i>
                </div>
                <span class="logo-text">gocart.</span>
            </div>
        </div>

        <div class="sidebar-content">
            <div class="store-info">
                <div class="store-avatar">
                    <i class="fas fa-store"></i>
                </div>
                <div class="store-details">
                    <h4>GreatStack</h4>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item active">
                        <a href="/seller/dashboard" class="nav-link">
                            <i class="fas fa-chart-line"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/seller/add-product" class="nav-link">
                            <i class="fas fa-plus-square"></i>
                            <span>Add Product</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/seller/manage-product" class="nav-link">
                            <i class="fas fa-edit"></i>
                            <span>Manage Product</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/seller/orders" class="nav-link">
                            <i class="fas fa-shopping-bag"></i>
                            <span>Orders</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
        <!-- Header -->
        <header class="admin-header">
            <div class="header-content">
                <h1 class="page-title">Seller <span class="title-accent">Dashboard</span></h1>
                <div class="header-actions">
                    <div class="user-info">
                        <span class="user-greeting">Hi, Great</span>
                        <div class="user-avatar">
                            <i class="fas fa-user"></i>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dashboard Content -->
        <div class="dashboard-content">
            <!-- Stats Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-content">
                        <div class="stat-number">7</div>
                        <div class="stat-label">Total Products</div>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-box"></i>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-content">
                        <div class="stat-number">$323</div>
                        <div class="stat-label">Total Earnings</div>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-dollar-sign"></i>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-content">
                        <div class="stat-number">4</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-content">
                        <div class="stat-number">7</div>
                        <div class="stat-label">Total Ratings</div>
                    </div>
                    <div class="stat-icon">
                        <i class="fas fa-star"></i>
                    </div>
                </div>
            </div>

            <!-- Products Section -->
            <div class="products-section">
                <div class="products-grid">
                    <!-- Product Card 1 -->
                    <div class="product-showcase-card">
                        <div class="product-category">Electronics</div>
                        <div class="product-showcase-content">
                            <h4 class="product-showcase-title">Bluetooth Speaker</h4>
                            <div class="product-rating">
                                <div class="stars">
                                    <i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i>
                                </div>
                            </div>
                            <button class="view-product-btn">View Product</button>
                        </div>
                    </div>

                    <!-- Product Card 2 -->
                    <div class="product-showcase-card">
                        <div class="product-category">Others</div>
                        <div class="product-showcase-content">
                            <h4 class="product-showcase-title">Security Camera</h4>
                            <div class="product-rating">
                                <div class="stars">
                                    <i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i>
                                    <i class="fas fa-star"></i>
                                    <i class="far fa-star"></i>
                                </div>
                            </div>
                            <button class="view-product-btn">View Product</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Sidebar active state
        const navLinks = document.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
            link.addEventListener('click', function() {
                navLinks.forEach(l => l.parentElement.classList.remove('active'));
                this.parentElement.classList.add('active');
            });
        });
    </script>
</body>
</html>
