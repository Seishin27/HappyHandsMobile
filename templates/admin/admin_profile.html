<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Profile - BabyBloom</title>
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ range(1,9999)|random }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <main class="admin-container">
    <h1>Admin Profile</h1>
    <p><strong>Username:</strong> {{ (admin.username if admin else None) or 'Admin' }}</p>
    <p><strong>Email:</strong> {{ (admin.email if admin else None) or 'admin@example.com' }}</p>

    <form method="post" action="{{ url_for('admin_logout') }}">
      <button type="submit">Logout</button>
    </form>

    <p><a href="{{ url_for('admin_dashboard') }}">Back to dashboard</a></p>
  </main>
</body>
</html>
