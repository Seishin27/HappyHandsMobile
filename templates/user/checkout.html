<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout - BabyBloom</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="{{ url_for('static', filename='images/favicon.png') }}?v={{ range(1,9999)|random }}" type="image/png">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=checkout-{{ range(1,9999)|random }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}?v=1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="checkout-page" data-user-id="{{ user.userID if user else '' }}" data-server-flashes='{{ get_flashed_messages(with_categories=true) | tojson | safe }}'>
  <header>
    {% include "partials/_navbar.html" %}
  </header>

  <main class="checkout-shell page-shell">
    <h1 class="checkout-title">Checkout</h1>
    <p class="checkout-subtitle">Review your delivery details and confirm your order.</p>

    <div id="checkoutRoot"
         data-mode="{{ mode }}"
         data-cart-items='{{ cart_items | tojson | safe }}'
         data-direct-item='{{ direct_item | tojson | safe }}'>
      <div class="checkout-layout">
        <div class="checkout-left">
          <section class="checkout-card">
            <div class="checkout-card-header">
              <div>
                <div class="checkout-card-title">Saved addresses</div>
                <div class="checkout-card-subtitle">Tap an address to use it for this order.</div>
              </div>
              <div class="checkout-card-header-actions">
                <button type="button" id="addAddressBtn" class="btn-small-outline">Save this address</button>
              </div>
            </div>
            <div id="savedAddressesList" class="saved-addresses-list"></div>
          </section>

          <section class="checkout-card">
            <div class="checkout-card-header">
              <div class="checkout-card-title">Delivery details</div>
            </div>
            <form id="checkoutAddressForm" class="checkout-form-grid" autocomplete="on" data-validate-form>
              <div class="checkout-form-group">
                <label for="region" class="checkout-label">Region *</label>
                <select id="region" name="region" class="checkout-select" required>
                  <option value="">Select Region</option>
                </select>
              </div>

              <div class="checkout-form-group">
                <label for="province" class="checkout-label">Province *</label>
                <select id="province" name="province" class="checkout-select" required>
                  <option value="">Select Province</option>
                </select>
              </div>

              <div class="checkout-form-group">
                <label for="city" class="checkout-label">City / Municipality *</label>
                <select id="city" name="city" class="checkout-select" required>
                  <option value="">Select City/Municipality</option>
                </select>
              </div>

              <div class="checkout-form-group">
                <label for="barangay" class="checkout-label">Barangay *</label>
                <select id="barangay" name="barangay" class="checkout-select" required>
                  <option value="">Select Barangay</option>
                </select>
              </div>

              <div class="checkout-form-group checkout-full-width">
                <label for="homeAddress" class="checkout-label">Home address / landmark *</label>
                <input id="homeAddress" name="home_address" type="text" class="checkout-input" placeholder="House, street, village, or landmark" required>
              </div>

              <div class="checkout-form-group checkout-full-width">
                <label for="contactNumber" class="checkout-label">Contact number *</label>
                <input id="contactNumber" name="contact_number" type="tel" class="checkout-input" placeholder="09XX-XXX-XXXX" required>
              </div>
            </form>
          </section>
        </div>

        <div class="checkout-right">
          <section class="order-summary-card">
            <div class="order-summary-header">
              <div class="order-summary-title">Order summary</div>
            </div>

            <div id="orderItems" class="order-summary-items"></div>

            <div class="order-summary-totals">
              <div class="order-summary-row">
                <span>Subtotal</span>
                <span id="orderSubtotal">₱0.00</span>
              </div>
              <div class="order-summary-row">
                <span>Shipping</span>
                <span id="orderShipping" data-shipping-loading="false">₱36.00</span>
              </div>
              <div class="order-summary-row total">
                <span>Total</span>
                <span id="orderTotal">₱0.00</span>
              </div>
            </div>

            <div class="payment-card">
              <div class="checkout-card-header">
                <div class="checkout-card-title">Payment</div>
              </div>
              <label class="payment-option-row">
                <input type="radio" name="payment_method" value="cash_on_delivery" checked>
                <div class="payment-option-main">
                  <strong>Cash on Delivery (COD)</strong>
                  <small>Pay safely with cash when your order arrives.</small>
                </div>
              </label>
            </div>

            <button type="button" id="placeOrderBtn" class="checkout-primary-btn">
              Place order
            </button>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="{{ url_for('static', filename='js/confirm_helper.js') }}"></script>
  <script src="{{ url_for('static', filename='js/design_system.js') }}"></script>
  <script src="{{ url_for('static', filename='js/index.js') }}"></script>
  <script src="{{ url_for('static', filename='js/checkout.js') }}?v=7"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
        // Messages button logic
        const msgBtns = document.querySelectorAll('.dropdown-messages');
        msgBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                window.location.href = '/profile#profile-messages';
            });
        });
    });
  </script>
</body>
</html>
