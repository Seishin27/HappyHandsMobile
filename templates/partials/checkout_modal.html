<div id="checkoutModal" class="modal">
  <div class="modal-content checkout-layout">
    <!-- Saved addresses sidebar -->
    <aside class="checkout-sidebar">
      <div class="checkout-sidebar-header">
        <h3>Saved Addresses</h3>
        <button type="button" id="chk_openSaveAddress" class="btn-small">Save Address</button>
      </div>
      <div id="chk_savedAddressesList" class="saved-addresses-list">
        <!-- Populated via JS using /api/user/address -->
        <p class="saved-empty">No saved address yet.</p>
      </div>
    </aside>

    <!-- Main checkout content -->
    <div class="checkout-main">
      <div class="modal-body">
        <form id="checkoutFormAjax">
          <div class="address-section">
            <h3>Delivery Address</h3>
            <div class="form-group">
              <label for="chk_region">Region</label>
              <select name="region" id="chk_region" required class="form-control">
                <option value="">Select Region</option>
              </select>
            </div>
            <div class="form-group">
              <label for="chk_province">Province</label>
              <select name="province" id="chk_province" required class="form-control">
                <option value="">Select Province</option>
              </select>
            </div>
            <div class="form-group">
              <label for="chk_city">City / Municipality</label>
              <select name="city" id="chk_city" required class="form-control">
                <option value="">Select City/Municipality</option>
              </select>
            </div>
            <div class="form-group">
              <label for="chk_barangay">Barangay</label>
              <select name="barangay" id="chk_barangay" required class="form-control">
                <option value="">Select Barangay</option>
              </select>
            </div>
            <div class="form-group">
              <label for="chk_home_address">Home Address / Landmark</label>
              <input type="text" name="home_address" id="chk_home_address" required class="form-control" />
            </div>
            <div class="form-group">
              <label for="chk_contact_number">Contact Number</label>
              <input type="text" name="contact_number" id="chk_contact_number" required class="form-control" />
            </div>
          </div>

          <div class="payment-section">
            <h3>Payment Method</h3>
            <div class="form-group">
              <select name="payment_method" id="chk_payment_method" class="form-control">
                <option value="cash_on_delivery">Cash on Delivery</option>
              </select>
            </div>
          </div>

          <div class="order-summary" id="chk_orderSummary">
            <!-- Order summary (product or cart) is injected via JS -->
          </div>

          <div class="modal-actions">
            <button type="button" id="chk_cancel" class="btn-cancel">Cancel</button>
            <button type="submit" id="chk_submit" class="btn-checkout">Place Order</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- Save Address popup modal -->
<div id="saveAddressModal" class="modal">
  <div class="modal-content save-address-content">
    <div class="modal-header">
      <h2>Save Address</h2>
      <button type="button" class="close" id="sa_close">&times;</button>
    </div>
    <div class="modal-body">
      <form id="saveAddressForm">
        <div class="form-group">
          <label for="sa_region">Region</label>
          <input type="text" id="sa_region" name="region" required class="form-control" />
        </div>
        <div class="form-group">
          <label for="sa_province">Province</label>
          <input type="text" id="sa_province" name="province" required class="form-control" />
        </div>
        <div class="form-group">
          <label for="sa_city">City / Municipality</label>
          <input type="text" id="sa_city" name="city" required class="form-control" />
        </div>
        <div class="form-group">
          <label for="sa_barangay">Barangay</label>
          <input type="text" id="sa_barangay" name="barangay" required class="form-control" />
        </div>
        <div class="form-group">
          <label for="sa_home_address">Home Address / Landmark</label>
          <input type="text" id="sa_home_address" name="home_address" required class="form-control" />
        </div>
        <div class="form-group">
          <label for="sa_contact_number">Contact Number</label>
          <input type="text" id="sa_contact_number" name="contact_number" required class="form-control" />
        </div>
        <div class="modal-actions">
          <button type="button" id="sa_cancel" class="btn-cancel">Cancel</button>
          <button type="submit" id="sa_save" class="btn-checkout">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
